name: IPA

# Builds an unsigned OpenSpend.ipa and publishes it to GitHub Releases.
# - push to main  -> rolling pre-release "latest"
# - tag v*        -> versioned release
# Unsigned: install with a sideloading tool (AltStore, Sideloadly, TrollStore) that signs it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (Release, device, unsigned)
        run: |
          xcodebuild build \
            -project OpenSpend.xcodeproj -scheme OpenSpend -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || { grep -E "error:" build.log | sort -u; exit 1; }

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/OpenSpend.app ipa/Payload/
          (cd ipa && zip -qry ../OpenSpend.ipa Payload)
          ls -la OpenSpend.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSpend-ipa
          path: OpenSpend.ipa

      - name: Publish rolling "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OpenSpend.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Unsigned build of $(git rev-parse --short HEAD). Sideload with AltStore, Sideloadly or TrollStore."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenSpend.ipa --title "OpenSpend $GITHUB_REF_NAME" \
            --notes "Unsigned build. Sideload with AltStore, Sideloadly or TrollStore."

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-log
          path: build.log
