name: OpenSpend
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Change these four to your own values.
    APP_BUNDLE_ID: com.example.OpenSpend
    APP_GROUP: group.com.example.OpenSpend
    GOOGLE_CLIENT_ID: YOUR_CLIENT_ID.apps.googleusercontent.com
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.YOUR_CLIENT_ID

schemes:
  OpenSpend:
    build:
      targets:
        OpenSpend: all
        OpenSpendWidget: all
    test:
      targets:
        - OpenSpendTests
        - OpenSpendUITests

targets:
  OpenSpend:
    type: application
    platform: iOS
    sources:
      - OpenSpend
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: OpenSpend/OpenSpend.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    info:
      path: OpenSpend/Info.plist
      properties:
        CFBundleDisplayName: OpenSpend
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        AppGroupID: $(APP_GROUP)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [openspend]
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        LSApplicationQueriesSchemes: [shortcuts]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(APP_BUNDLE_ID).refresh]
    dependencies:
      - target: OpenSpendWidget

  OpenSpendWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Widget/OpenSpendWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: OpenSpend Widget
        AppGroupID: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  OpenSpendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/SheetCodec.swift
      - Shared/Formatting.swift

  OpenSpendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: OpenSpend
